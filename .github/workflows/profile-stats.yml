name: Actualizar estadísticas del perfil

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/profile-stats.yml'
      - 'scripts/**'
      - 'data/profile.json'
      - 'data/projects.json'
  schedule:
    - cron: "23 * * * *"

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install 'fonttools>=4.60,<5'
      - run: python scripts/fetch_fonts.py
      - run: python -m unittest discover -s scripts -p 'test_profile_stats.py'
      - run: python scripts/profile_stats.py
      - run: python scripts/build_profile.py
      - run: python -m unittest discover -s scripts -p 'test_profile_assets.py'
      - run: node --test scripts/kitsune.test.mjs
      - name: Guardar solo los datos y recursos del perfil
        run: |
          git add README.md data/github-stats.json assets/profile
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Actualizar estadísticas públicas del perfil'
          git push
